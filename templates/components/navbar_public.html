{% load i18n static %}
<header class="sticky top-0 z-50 bg-petly-blue border-b border-petly-blue/80 transition-all">
    <div class="container mx-auto px-3 sm:px-4 lg:px-6">
        <div class="flex items-center justify-between h-14 sm:h-16 gap-2 sm:gap-4 flex-nowrap">
            <!-- Logotipo y marca oficial del prototipo -->
            <div class="flex items-center shrink-0">
                <a href="{% url 'core:home' %}" class="flex items-center gap-2 group select-none no-underline py-1">
                    <img src="{% static 'images/logo.png' %}" alt="Petly" class="w-5 h-5 sm:w-6.5 sm:h-6.5 object-contain shrink-0 group-hover:scale-105 transition-transform duration-200">
                    <span class="font-bold text-xl sm:text-2xl tracking-tight text-neutral-800 group-hover:text-petly-coral transition-colors leading-none">
                        Petly
                    </span>
                </a>
            </div>

            <!-- Controles públicos simétricos y sin solapamiento en cualquier resolución -->
            <div class="flex items-center gap-2 sm:gap-3 shrink-0 flex-nowrap">
                <!-- Selector de idioma con espaciado simétrico calibrado -->
                <form action="{% url 'set_language' %}" method="post" class="inline-flex items-center shrink-0">
                    {% csrf_token %}
                    <input name="next" type="hidden" value="{{ request.path }}">
                    <label for="language-select-public" class="sr-only">{% translate "Seleccionar idioma" %}</label>
                    <div class="relative inline-flex items-center shrink-0">
                        <span class="absolute inset-y-0 left-2.5 flex items-center justify-center pointer-events-none text-neutral-500">
                            {% include 'components/icon.html' with name="globe" class="w-3.5 h-3.5" %}
                        </span>
                        <select id="language-select-public" name="language" onchange="this.form.submit()" aria-label="{% translate 'Seleccionar idioma' %}" class="h-8 pl-7 pr-7 text-xs font-semibold text-neutral-800 bg-white hover:bg-neutral-50 hover:border-neutral-400 border border-neutral-300 rounded-full cursor-pointer transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-petly-coral/30 appearance-none leading-none">
                            {% get_current_language as CURRENT_LANGUAGE %}
                            {% get_available_languages as AVAILABLE_LANGUAGES %}
                            {% for lang_code, lang_name in AVAILABLE_LANGUAGES %}
                                <option value="{{ lang_code }}" {% if lang_code == CURRENT_LANGUAGE %}selected{% endif %}>
                                    {{ lang_code|upper }}
                                </option>
                            {% endfor %}
                        </select>
                        <span class="absolute inset-y-0 right-2.5 flex items-center justify-center pointer-events-none select-none text-neutral-400">
                            {% include 'components/icon.html' with name="chevron-down" class="w-3 h-3" %}
                        </span>
                    </div>
                </form>

                <div class="hidden sm:block h-4 w-px bg-neutral-300/80 shrink-0"></div>

                <!-- Botones de acceso público: Ocultos en móvil, visibles desde sm -->
                <a href="{% url 'accounts:login' %}" class="h-8 hidden sm:inline-flex items-center px-3 sm:px-4 rounded-full text-xs font-medium bg-white border border-neutral-300 text-neutral-800 hover:bg-neutral-100 hover:border-neutral-400 hover:text-neutral-900 shadow-xs transition-all duration-150 cursor-pointer no-underline select-none shrink-0 whitespace-nowrap">
                    {% translate "Iniciar sesión" %}
                </a>
                <a href="{% url 'accounts:register' %}" class="h-8 hidden sm:inline-flex items-center px-4 rounded-full text-xs font-medium bg-white/70 border border-neutral-300/80 text-neutral-800 hover:bg-white hover:border-neutral-400 hover:text-neutral-900 shadow-xs transition-all duration-150 cursor-pointer no-underline select-none shrink-0 whitespace-nowrap">
                    {% translate "Registrarse" %}
                </a>
            </div>
        </div>
    </div>
</header>
