{% comment %}
Componente de botón reutilizable según guía de estilos del prototipo.
Permite renderizar botones interactivos <button> o enlaces <a> con soporte de eventos y accesibilidad.

Parámetros:
- text: Texto del botón en sentence case (opcional para botones FAB)
- variant: 'primary' | 'secondary' | 'soft' | 'lilac' | 'outline' | 'danger' | 'segmented-active' | 'segmented-inactive' | 'fab-like' | 'fab-dismiss' | 'fab-add'
- href: Enlace opcional (si se define, renderiza <a>, sino <button>)
- type: 'button' | 'submit' | 'reset' (predeterminado: 'button')
- onclick: Código o función JavaScript a ejecutar al hacer clic (ej. "openModal('id')")
- id: Identificador único del elemento (opcional)
- name: Nombre del campo si se envía en formularios (opcional)
- value: Valor asociado si se envía en formularios (opcional)
- form: Identificador de formulario vinculado si está fuera de la etiqueta <form> (opcional)
- disabled: Booleano para deshabilitar el botón (opcional)
- role: Rol de accesibilidad (ej. 'tab') (opcional)
- aria_selected: Estado de selección (ej. 'true' | 'false') (opcional)
- data_value: Valor asociado a data-value para controles interactivos (opcional)
- icon: Nombre del ícono SVG opcional (ej. 'paw', 'heart', 'plus', 'trash')
- icon_class: Clases CSS personalizadas para el ícono SVG (opcional)
- aria_label: Etiqueta descriptiva para lectores de pantalla (recomendada si no hay texto)
- class: Clases CSS complementarias
- attrs: Atributos HTML adicionales personalizados (opcional)
{% endcomment %}

{% if href %}
    <a href="{{ href }}"
       {% if id %}id="{{ id }}"{% endif %}
       {% if onclick %}onclick="{{ onclick }}"{% endif %}
       {% if role %}role="{{ role }}"{% endif %}
       {% if aria_selected %}aria-selected="{{ aria_selected }}"{% endif %}
       {% if data_value %}data-value="{{ data_value }}"{% endif %}
       {% if aria_label %}aria-label="{{ aria_label }}"{% endif %}
       class="no-underline select-none {% if variant == 'secondary' %}btn-petly-secondary{% elif variant == 'soft' %}btn-petly-soft{% elif variant == 'lilac' %}btn-petly-lilac{% elif variant == 'outline' %}btn-petly-outline{% elif variant == 'danger' %}btn-petly-danger{% elif variant == 'segmented-active' %}segmented-pill segmented-pill-active{% elif variant == 'segmented-inactive' or variant == 'segmented' %}segmented-pill segmented-pill-inactive{% elif variant == 'fab-like' %}fab-petly-like{% elif variant == 'fab-dismiss' %}fab-petly-dismiss{% elif variant == 'fab-add' %}fab-petly-add{% else %}btn-petly-primary{% endif %} {{ class|default:'' }}"
       {{ attrs|default:'' }}>
        {% if icon %}
            <span class="inline-flex items-center justify-center shrink-0">{% include 'components/icon.html' with name=icon class=icon_class|default:'w-4 h-4' %}</span>
        {% elif variant == 'fab-like' and not text %}
            <span class="inline-flex items-center justify-center shrink-0">{% include 'components/icon.html' with name="heart-filled" class="w-6 h-6" %}</span>
        {% elif variant == 'fab-dismiss' and not text %}
            <span class="inline-flex items-center justify-center shrink-0">{% include 'components/icon.html' with name="close" class="w-6 h-6" %}</span>
        {% elif variant == 'fab-add' and not text %}
            <span class="inline-flex items-center justify-center shrink-0">{% include 'components/icon.html' with name="plus" class="w-6 h-6" %}</span>
        {% endif %}
        {% if text %}<span>{{ text }}</span>{% endif %}
    </a>
{% else %}
    <button type="{{ type|default:'button' }}"
            {% if id %}id="{{ id }}"{% endif %}
            {% if onclick %}onclick="{{ onclick }}"{% endif %}
            {% if form %}form="{{ form }}"{% endif %}
            {% if name %}name="{{ name }}"{% endif %}
            {% if value %}value="{{ value }}"{% endif %}
            {% if disabled %}disabled{% endif %}
            {% if role %}role="{{ role }}"{% endif %}
            {% if aria_selected %}aria-selected="{{ aria_selected }}"{% endif %}
            {% if data_value %}data-value="{{ data_value }}"{% endif %}
            {% if aria_label %}aria-label="{{ aria_label }}"{% endif %}
            class="select-none {% if variant == 'secondary' %}btn-petly-secondary{% elif variant == 'soft' %}btn-petly-soft{% elif variant == 'lilac' %}btn-petly-lilac{% elif variant == 'outline' %}btn-petly-outline{% elif variant == 'danger' %}btn-petly-danger{% elif variant == 'segmented-active' %}segmented-pill segmented-pill-active{% elif variant == 'segmented-inactive' or variant == 'segmented' %}segmented-pill segmented-pill-inactive{% elif variant == 'fab-like' %}fab-petly-like{% elif variant == 'fab-dismiss' %}fab-petly-dismiss{% elif variant == 'fab-add' %}fab-petly-add{% else %}btn-petly-primary{% endif %} {{ class|default:'' }}"
            {{ attrs|default:'' }}>
        {% if icon %}
            <span class="inline-flex items-center justify-center shrink-0">{% include 'components/icon.html' with name=icon class=icon_class|default:'w-4 h-4' %}</span>
        {% elif variant == 'fab-like' and not text %}
            <span class="inline-flex items-center justify-center shrink-0">{% include 'components/icon.html' with name="heart-filled" class="w-6 h-6" %}</span>
        {% elif variant == 'fab-dismiss' and not text %}
            <span class="inline-flex items-center justify-center shrink-0">{% include 'components/icon.html' with name="close" class="w-6 h-6" %}</span>
        {% elif variant == 'fab-add' and not text %}
            <span class="inline-flex items-center justify-center shrink-0">{% include 'components/icon.html' with name="plus" class="w-6 h-6" %}</span>
        {% endif %}
        {% if text %}<span>{{ text }}</span>{% endif %}
    </button>
{% endif %}
