{% if messages %}
<div class="container messages-container">
    {% for message in messages %}
    <div class="alert {% if message.tags == 'error' %}alert-error{% elif message.tags == 'success' %}alert-success{% elif message.tags == 'warning' %}alert-warning{% else %}alert-info{% endif %}" role="alert">
        <span>{{ message }}</span>
        <button type="button" class="alert-close" onclick="this.parentElement.remove()" aria-label="Cerrar">✕</button>
    </div>
    {% endfor %}
</div>
{% endif %}
