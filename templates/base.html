{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Petly - Red social para amantes de los animales y mascotas responsables.">
    <title>{% block title %}Petly - Red social para mascotas{% endblock %}</title>

    <!-- Tipografía autohospedada localmente (100% offline) definida en styles.css -->

    <!-- Tailwind CSS (incluye estilos base del sistema) compilado mediante django-tailwind -->
    {% tailwind_css %}

    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    {% block layout %}
        {% block content %}{% endblock %}
    {% endblock %}

    <!-- Scripts JavaScript base -->
    <script src="{% static 'js/main.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
